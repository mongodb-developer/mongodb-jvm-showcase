spring:
  mongodb:
    uri: ${MONGODB_URI}
    database: policy_agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    vectorstore:
      mongodb:
        collection-name: policy_kb
        index-name: vectorstore_index
        initialize-schema: true
#    chat:
#      memory:
#        repository:
#          mongo:
#            create-indices: true
#            ttl: 0
agent:
  memory:
    max-messages: 200 #hard cap for the window, must stay high enough to never bind before max-tokens
    max-tokens: 1500 #compacting is triggered when the retained window goes over this
    keep-tokens: 500 #token budget for the recent messages kept after compacting
devrel:
  application:
    track-name: devrel-tutorial-java-agent