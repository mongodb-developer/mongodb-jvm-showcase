<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>MongoDB Movie Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="styles.css?v=9" rel="stylesheet">
</head>
<body>
<header class="app-header">
    <div class="container header-inner">
        <a class="brand" href="#">
            <img src="img/logo.png" alt="MongoDB" class="brand-logo">
            <span class="brand-divider"></span>
            <span class="brand-title">Movie Search</span>
        </a>
        <nav class="header-links">
            <a href="https://github.com/mongodb-developer/mongodb-jvm-showcase/tree/main/java/use-cases/movie-recommendation/hybrid-search" target="_blank" rel="noopener">GitHub</a>
            <a class="link-accent" href="https://foojay.io/today/beyond-keywords-implementing-semantic-search-in-java-with-spring-data-part-1/" target="_blank" rel="noopener">How it was built →</a>
        </nav>
    </div>
</header>

<main class="container main-content">
    <section class="hero">
        <h1 class="hero-title">Find your next <span class="hero-highlight">favorite movie</span></h1>
        <p class="hero-subtitle">Describe a story, a scene, or a feeling. We'll find the movies that match.</p>

        <form id="search-form" class="search-form">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input id="q" name="query" type="text" placeholder="A shark terrorizes a small beach town..." autocomplete="off" aria-label="Search movies">
                <button id="btn-search" class="btn-search" type="submit">Search</button>
            </div>

            <div class="filters-row">
                <button class="filters-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#filters" aria-expanded="false">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Filters
                </button>
                <small id="status"></small>
            </div>

            <div class="collapse" id="filters">
                <div class="filters-panel">
                    <div class="filter-group">
                        <div class="filter-label">Genres</div>
                        <div class="genre-pills">
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Action"><span>Action</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Adventure"><span>Adventure</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Animation"><span>Animation</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Biography"><span>Biography</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Comedy"><span>Comedy</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Crime"><span>Crime</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Documentary"><span>Documentary</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Drama"><span>Drama</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Family"><span>Family</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Fantasy"><span>Fantasy</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Film-Noir"><span>Film-Noir</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="History"><span>History</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Horror"><span>Horror</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Music"><span>Music</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Musical"><span>Musical</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Mystery"><span>Mystery</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Romance"><span>Romance</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Sci-Fi"><span>Sci-Fi</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Short"><span>Short</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Sport"><span>Sport</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Thriller"><span>Thriller</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="War"><span>War</span></label>
                        <label class="genre-pill"><input class="genre" type="checkbox" value="Western"><span>Western</span></label>
                        </div>
                        <div class="form-check form-switch mt-3">
                            <input class="form-check-input" type="checkbox" id="excludeGenres">
                            <label class="form-check-label" for="excludeGenres">Exclude selected genres</label>
                        </div>
                    </div>

                    <div class="filter-grid">
                        <div class="filter-group">
                            <label class="filter-label" for="yearFrom">Release year</label>
                            <div class="range-inputs">
                                <input type="number" min="1900" max="2100" id="yearFrom" class="field" placeholder="From">
                                <span>–</span>
                                <input type="number" min="1900" max="2100" id="yearTo" class="field" placeholder="To">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label" for="minIMDbRating">Minimum IMDb rating</label>
                            <input type="number" min="0" max="10" step="0.1" id="minIMDbRating" class="field" placeholder="★ 7.0">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>

    <div id="alerts"></div>
    <div id="active-filters"></div>
    <div id="results" class="results-grid"></div>
</main>

<div class="modal fade" id="movieModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <button type="button" class="btn-close btn-close-white modal-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <div class="modal-body">
                <div class="row g-4">
                    <div class="col-md-4">
                        <img id="modalPoster" class="modal-poster" alt="Poster">
                    </div>
                    <div class="col-md-8">
                        <h4 id="modalTitle" class="modal-movie-title"></h4>
                        <div id="modalMeta" class="modal-meta"></div>
                        <div id="modalGenres" class="mb-3"></div>
                        <p id="modalPlot" class="modal-plot"></p>
                        <div id="modalCast"></div>
                        <div id="modalExtra"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="app-footer">
    <div class="container">Powered by Spring, Voyage AI &amp; MongoDB Vector Search</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js?v=4"></script>
</body>
</html>
