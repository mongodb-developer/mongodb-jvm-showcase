spring:
  application:
    name: agentic-wms
  mongodb:
    uri: ${MONGODB_URI}
    database: agentic-wms
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    vectorstore:
      mongodb:
        initialize-schema: true
        collection-name: depositor_knowledge
        index-name: vector-index
  data:
    mongodb:
      auto-index-creation: true
logging:
  level:
    org.springframework.data.mongodb.core: DEBUG