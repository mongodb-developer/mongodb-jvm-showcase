spring:
  application:
    name: agentic-wms
  mongodb:
    uri: ${MONGODB_URI}
    database: agentic-wms
  ai:
    tools:
      throw-exception-on-error: true
    model:
      embedding: none
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1}
    vectorstore:
      mongodb:
        initialize-schema: true
        collection-name: depositor_knowledge
        index-name: vector-index
        metadata-fields-to-filter:
          - depositorId
          - type
  data:
    mongodb:
      auto-index-creation: false
voyage:
  base-url: ${VOYAGE_BASE_URL}
  api-key: ${VOYAGE_API_KEY}
  model: ${VOYAGE_MODEL:voyage-4}
  dimensions: ${VOYAGE_DIMENSIONS:1024}
devrel:
  application:
    track-name: devrel-tutorial-java-agentic-wms
wms:
  knowledge:
    ingest-on-startup: true
  limits:
    enabled: ${LIMITS_ENABLED:true}
    per-ip-requests-per-minute: ${LIMITS_PER_IP_PER_MINUTE:10}
    global-requests-per-day: ${LIMITS_GLOBAL_PER_DAY:100}
    agent-runs-per-day: ${LIMITS_AGENT_RUNS_PER_DAY:50}
    max-policy-text-length: ${LIMITS_MAX_POLICY_TEXT_LENGTH:2000}
logging:
  level:
    org.springframework.data.mongodb.core: DEBUG
---
spring:
  config:
    activate:
      on-profile: grove
  ai:
    openai:
      api-key: ""
      custom-headers:
        api-key: ${GROVE_API_KEY}